# Move everything onto a single line by using the main format string
format = """$directory$git_branch$git_status$character"""

# Disable the blank line inserted between terminal prompts
add_newline = false

[git_status]
disabled = false
# Escaped literal square brackets around the status/ahead-behind group
format = '([\[$all_status$ahead_behind\]]($style) )'

staged = '[+$count](green)'
modified = '[!$count](yellow)'
deleted = '[✘$count](red)'
untracked = '[?$count](blue)'
renamed = '[»$count](purple)'
conflicted = '[=$count](bold red)'
stashed = '[\$ $count](grey)'

ahead = '⇡${count}'
behind = '⇣${count}'
diverged = '⇡${ahead_count}⇣${behind_count}'
